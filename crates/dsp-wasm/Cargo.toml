[package]
name = "dsp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "C-ABI bridge exposing the Botanica + PhasePlan engines over wasm linear memory (no wasm-bindgen), instantiable directly inside an AudioWorklet."

# cdylib → the .wasm for the web; rlib → so the native test harness can link
# and exercise the same ABI on the host.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dsp-core = { workspace = true }
botanica = { path = "../botanica" }
phaseplan = { path = "../phaseplan" }
