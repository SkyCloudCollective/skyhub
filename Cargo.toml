# Rust workspace root — one Cargo.lock for every crate.
#
# The dependency graph IS the anti-divergence safeguard:
#   dsp-core  ──►  botanica / phaseplan  ──►  dsp-wasm (web)
#                                         └─►  plugin-* (native VST3/CLAP)
# DSP lives ONLY in dsp-core + the instrument crates; the wasm and plugin
# wrappers are thin and contain no signal processing, so the web studio and the
# native plugin run byte-identical code (proven by the golden-render tests).
[workspace]
resolver = "2"
members = [
    "crates/dsp-core",
    "crates/botanica",
    "crates/phaseplan",
    "crates/dsp-wasm",
    "crates/plugin-phaseplan",
    "crates/plugin-botanica",
    "crates/xtask",
    # added as each crate lands (keeps `cargo check` green meanwhile):
    # Desktop Tauri app — intentionally excluded from `cargo clippy/test
    # --workspace` in ci.yml (requires webkit2gtk / WebView2 system deps).
    # The dedicated desktop-* CI jobs handle it via `cargo tauri build`.
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["the SkyCloudCollective"]
rust-version = "1.80"

[workspace.dependencies]
dsp-core = { path = "crates/dsp-core" }

# Release profile tuned for real-time audio: no debug-assert overhead in the
# audio thread, aggressive inlining across crates (LTO) for the DSP hot path.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
