name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust: DSP core + instruments + plugin wrappers. Golden-render tests here. ──
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Exclude `desktop`: it needs webkit2gtk / WebView2 system libs not on this
      # runner. The desktop-linux / desktop-windows jobs in release.yml build and
      # verify it (via tauri-action) on a `v*` tag — that's its first real build.
      - run: cargo clippy --workspace --exclude desktop -- -D warnings
      - run: cargo test --workspace --exclude desktop

  # ── Native plugins: build the CLAP/VST3 bundles.
  #
  #   linux  — runs directly on the Ubuntu runner (no system audio libs needed
  #             in `vst3` mode — no `standalone`).
  #   windows — cross-compiled from Linux via cargo-xwin (x86_64-pc-windows-msvc).
  #             The MSVC CRT + SDK are auto-downloaded by xwin; lld-link is
  #             bundled. No Windows runner required.
  #   macos  — requires a real Mac runner; triggered by the separate release
  #             workflow (JAUNE: needs Marwan's MAC_SIGN_ID for notarization).
  #
  # pluginval validation and signed release matrix run in a later release
  # workflow (JAUNE: Marwan's keys required).
  plugins-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-plugins-linux.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-linux-x86_64
          path: dist/linux-x86_64/

  plugins-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-xwin
        run: cargo install cargo-xwin
      - run: bash scripts/build-plugins-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-x86_64
          path: dist/windows-x86_64/

  # ── API: the single FastAPI service. ──
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: services/api
        run: |
          uv sync
          uv run pytest

  # ── Web: build the DSP wasm, stage it, then the SvelteKit static build. The
  #    studio is non-functional without the staged wasm, so this job owns both. ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # builds crates/dsp-wasm → apps/web/static/dsp/dsp_wasm.wasm + headless smoke
      - run: bash tools/build-wasm.sh
      - working-directory: apps/web
        run: |
          pnpm run check
          pnpm run build

  # ── Residue gate: nothing internal may ship in an artifact. ──
  audit:
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Scans the source tree with GENERIC patterns. The deployment-specific
      # pattern file (ci/audit-patterns.local) is gitignored and supplied only
      # in the publish job, not here. (The built .wasm is pure DSP — no embedded
      # config — so it isn't scanned here; revisit if that changes.)
      - run: python3 ci/audit-artifact.py apps services packages crates docs ops
