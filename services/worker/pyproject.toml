[project]
name = "skyhub-worker"
version = "0.1.0"
description = "SkyHub worker — audio analysis (BPM/key/timbre) + ingest into the catalog."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "librosa>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
